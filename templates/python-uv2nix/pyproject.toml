[project]
name = "my-app"
version = "0.1.0"
description = "My Python application"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
