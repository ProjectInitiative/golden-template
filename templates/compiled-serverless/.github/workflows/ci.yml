name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    strategy:
      matrix:
        system:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.system }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v10
      - run: nix flake check

  build:
    needs: check
    strategy:
      matrix:
        target:
          - default
          - rust-monolith
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v10
      - run: nix build .#${{ matrix.target }}
