[project]
name = "ingestion-pipeline"
version = "0.1.0"
description = "Ingestion pipeline: direct-to-S3 upload, NATS queue, K8s processing"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "flask>=3.0",
    "nats-py>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
