apiVersion: v1
kind: Namespace
metadata:
  name: ingestion-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: ingestion-system
data:
  nats-server.conf: |
    port: 4222
    jetstream: enabled
    store_dir: /data/jetstream
    limits:
      max_payload: 64MB
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: ingestion-system
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: cluster
      port: 6222
      targetPort: 6222
    - name: monitor
      port: 8222
      targetPort: 8222
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: ingestion-system
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:latest
          args: ["--config", "/etc/nats/nats-server.conf"]
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 6222
              name: cluster
            - containerPort: 8222
              name: monitor
          volumeMounts:
            - name: config
              mountPath: /etc/nats
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: nats-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
