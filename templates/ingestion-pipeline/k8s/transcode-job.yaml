apiVersion: batch/v1
kind: Job
metadata:
  name: processing-template
  namespace: media-pipeline
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: jlesage/handbrake-cli:latest
          env:
            - name: S3_ENDPOINT
              value: "http://garage-daemon.storage.svc.cluster.local:3900"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: secret-key
          command:
            - /bin/sh
            - -c
            - |
              echo "Processing $TARGET_OBJECT ..."
          volumeMounts:
            - name: scratch
              mountPath: /scratch
            - name: output
              mountPath: /output
      volumes:
        - name: scratch
          emptyDir: {}
        - name: output
          persistentVolumeClaim:
            claimName: output-pvc
