apiVersion: batch/v1
kind: Job
metadata:
  name: process-template
  namespace: ingestion-system
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: your-worker-image:latest
          env:
            - name: S3_ENDPOINT
              value: "http://garage-daemon.storage.svc.cluster.local:3900"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: secret-key
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail

              # Idempotent: skip if output already exists
              if [ -n "$OUTPUT_PATH" ] && [ -f "$OUTPUT_PATH" ]; then
                echo "Output already exists at $OUTPUT_PATH — skipping."
                exit 0
              fi

              echo "Processing $TARGET_OBJECT ..."

              # (processing logic here — MakeMKV, HandBrakeCLI, OCR, etc.)

              echo "Done: $TARGET_OBJECT"
          volumeMounts:
            - name: scratch
              mountPath: /scratch
            - name: output
              mountPath: /output
      volumes:
        - name: scratch
          emptyDir: {}
        - name: output
          persistentVolumeClaim:
            claimName: output-pvc
